apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-cash-in-api-config
data:
  NODE_ENV: production
  PORT: "3000"
  MONGO_DB: wallet
  THROTTLE_TTL_MS: "60000"
  THROTTLE_LIMIT: "100"
  CORS_ALLOWED_ORIGIN: "https://app.example.com"
  SWAGGER_ENABLED: "false"
  MONGO_SERVER_SELECTION_TIMEOUT_MS: "5000"
  HEALTH_CHECK_TIMEOUT_MS: "800"
  PROVIDER_TIMEOUT_MS: "3000"
  PROVIDER_MAX_ATTEMPTS: "3"
  RETRY_BASE_DELAY_MS: "50"
  RETRY_MAX_DELAY_MS: "1000"
  OPERATION_LEASE_MS: "15000"
  SETTLEMENT_MAX_ATTEMPTS: "5"
  WEBHOOK_TOLERANCE_SECONDS: "300"
  RECONCILER_ENABLED: "true"
  RECONCILER_INTERVAL_MS: "15000"
  RECONCILER_MIN_AGE_MS: "30000"
  RECONCILER_BATCH_SIZE: "20"
  RECONCILER_MAX_PROVIDER_CALLS: "10"
