apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-cash-in-api
  labels:
    app: wallet-cash-in-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: wallet-cash-in-api
  template:
    metadata:
      labels:
        app: wallet-cash-in-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/OWNER/wallet-cash-in:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: wallet-cash-in-api-config
            - secretRef:
                name: wallet-cash-in-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            # Each dependency check has HEALTH_CHECK_TIMEOUT_MS (800ms): margin over it.
            timeoutSeconds: 2
            failureThreshold: 3
